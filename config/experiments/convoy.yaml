# Three-drone surprisal convoy experiment

# Formation: CF1 leads, CF2 is 1 m behind, CF3 is 2 m behind.
start_x: [0.0, -1.0, -2.0]
formation_time: 3.0

# Virtual wall: 5 m from CF1's starting position.
wall_x: 5.0
wall_stop_distance: 0.5

# Leader motion
leader_speed: 0.15

# Followers
follow_distance: 1.0
follow_gain: 0.8
max_follow_speed: 0.15

# Safety: reverse if the gap becomes dangerously small.
safe_distance: 0.55

# Surprisal gating
noise_scale: 0.20
surprise_gain: 1.0

# Timing
duration: 60.0
control_period: 0.1
