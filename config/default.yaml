# ============================================================
# default.yaml — shared settings for EVERY script in this repo.
#
# Used by: src/utils/connection.py (URIs), src/utils/flight.py
# (takeoff/land), and every experiment / sanity test.
# Per-experiment files in config/experiments/ add to (or override)
# these values.
#
# Rule: if a number affects a result, it lives in a config file,
# not inside a Python script.
# ============================================================

# "sim" = CrazySim on this computer, "real" = real Crazyflies over radio.
# This is the ONLY switch between simulation and hardware.
mode: sim

# --- Connection -------------------------------------------------
# One URI per drone. Drone 0 is the first entry (called CF1 in prints).
uris:
  sim:
    - udp://127.0.0.1:19850   # CF1
    - udp://127.0.0.1:19851   # CF2
    - udp://127.0.0.1:19852   # CF3
  real:
    # [FILL IN] your radio addresses, e.g. radio://0/80/2M/E7E7E7E7E1
    - radio://0/80/2M/E7E7E7E7E6
    - radio://0/80/2M/E7E7E7E7E5
    - radio://0/80/2M/E7E7E7E7E7

# Folder where CFLib stores the drone's parameter/log tables.
cache_dir: ./cache

# --- Flight -----------------------------------------------------
height: 0.9            # m, hover altitude after takeoff
takeoff_time: 8.0      # s, how long the takeoff manoeuvre takes
land_time: 2.0         # s, how long the landing manoeuvre takes

# --- Telemetry --------------------------------------------------
log_period_ms: 100     # how often the drone sends its state (100 ms = 10 Hz)

# --- Safety (used by src/utils/safety.py) -----------------------
# Arena = the box the drones must stay inside, in Lighthouse coordinates (m).
# A drone outside it -> refuse to take off / land everything immediately.
arena:
  sim:                 # big: CrazySim has no walls
    x_min: -10.0
    x_max: 10.0
    y_min: -10.0
    y_max: 10.0
    z_max: 2.0
  real:                # [CONFIRM] measure YOUR flight area and keep ~0.5 m
    x_min: -1.5        # away from walls / base stations / people
    x_max: 1.5
    y_min: -1.0
    y_max: 1.0
    z_max: 1.2

max_data_age: 0.5      # s, land everything if a drone's data is older than this
max_speed: 1.0         # m/s, CUT MOTORS if a drone moves faster (flying away)
min_battery_v: 3.8     # V, refuse to take off below this (measured at rest)

preflight_max_spread: 0.05   # m, refuse to fly if the position jumps more than
                             # this while the drone sits still on the floor


# --- Output -----------------------------------------------------
log_dir: data/raw      # where CSV logs + JSON sidecars are written
